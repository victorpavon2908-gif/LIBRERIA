# JVM that runs the Gradle daemon.
#
# Pinned to Java 21 on purpose: Android Studio ships a much newer JBR (Java 25),
# and the lint engine bundled with Android Gradle Plugin 8.7.3 cannot parse that
# version string (java.lang.IllegalArgumentException: 25.0.2), which makes
# :app:lintDebug / :app:lintVitalRelease fail on an otherwise healthy project.
# Java 21 is installed by Android Studio itself (see ~/.jdks) and is fully
# supported by Gradle 9.3, AGP 8.7.3 and Kotlin 2.0.21.
#
# Gradle picks the first matching installed JDK, so no absolute path is stored
# here. Regenerate with: gradlew updateDaemonJvm --jvm-version=21
toolchainVersion=21
